# docker-compose.yml
# crear un .env con el MSSQL_SA_PASSWORD=tuPassword, antes de ejectar dokcer-compose
x-sql-common: &sql-common
  image: mcr.microsoft.com/mssql/server:2025-latest
  restart: unless-stopped
  networks:
    - wwi_network

x-sql-env: &sql-env
  ACCEPT_EULA: "Y"
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Crea el archivo .env con MSSQL_SA_PASSWORD}
  MSSQL_PID: Developer
  MSSQL_AGENT_ENABLED: "true"

services:
  # NODO 1: CORPORATIVO (Escazu) - puerto host 1433
  corporativo:
    <<: *sql-common
    container_name: nodo_corporativo
    hostname: nodo_corporativo
    environment: *sql-env
    ports:
      - "1433:1433"
    volumes:
      - ./data_corp/data:/var/opt/mssql/data
      - ./data_corp/log:/var/opt/mssql/log
      - ./data_corp/secrets:/var/opt/mssql/secrets
      - ./data_corp/backup:/var/opt/mssql/backup
      - ./data_corp/repldata:/var/opt/mssql/ReplData

  # NODO 2: SUCURSAL SAN JOSE - puerto host 1434
  sucursal_sj:
    <<: *sql-common
    container_name: nodo_sucursal_sj
    hostname: nodo_sucursal_sj
    environment: *sql-env
    ports:
      - "1434:1433"
    volumes:
      - ./data_sj/data:/var/opt/mssql/data
      - ./data_sj/log:/var/opt/mssql/log
      - ./data_sj/secrets:/var/opt/mssql/secrets
      - ./data_sj/backup:/var/opt/mssql/backup
      - ./data_sj/repldata:/var/opt/mssql/ReplData

  # NODO 3: SUCURSAL LIMON - puerto host 1435
  sucursal_limon:
    <<: *sql-common
    container_name: nodo_sucursal_limon
    hostname: nodo_sucursal_limon
    environment: *sql-env
    ports:
      - "1435:1433"
    volumes:
      - ./data_limon/data:/var/opt/mssql/data
      - ./data_limon/log:/var/opt/mssql/log
      - ./data_limon/secrets:/var/opt/mssql/secrets
      - ./data_limon/backup:/var/opt/mssql/backup
      - ./data_limon/repldata:/var/opt/mssql/ReplData

networks:
  wwi_network:
    driver: bridge
